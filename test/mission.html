<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060f">
<title>말랑 미션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&display=swap" rel="stylesheet">
<!-- QR 인식: jsQR 1.4.0 (버전 고정) -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  [hidden]{display:none!important}
  :root{
    --bg:#05060f; --ink:#eaf2ff; --dim:#8fa3c8; --hud:#7cf7ff; --yellow:#ffd43b;
    --red:#ff5c7a; --green:#5cffb0;
    --panel:rgba(10,16,38,.92); --line:rgba(124,247,255,.45);
    --title:'Black Han Sans','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    --body:'Do Hyeon','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--body);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
  button{font-family:inherit;color:inherit}

  #cam,#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  #cam{object-fit:cover;background:#000}
  #stars{background:radial-gradient(ellipse at 50% 30%,#141a3d 0%,#070916 60%,#03040a 100%)}
  #tint{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,rgba(5,6,15,0) 55%,rgba(5,6,15,.55) 100%)}
  body.term #tint{background:rgba(3,6,18,.55)}

  #stage{position:fixed;inset:0;z-index:2;overflow:hidden}
  .layer{position:absolute;inset:0}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(var(--sat) + 116px) calc(var(--sar) + 12px) calc(var(--sab) + 90px) calc(var(--sal) + 12px)}
  .panel{position:relative;background:var(--panel);border:3px solid #000;border-radius:22px;
    box-shadow:0 0 0 2px var(--line),0 8px 0 #000;padding:14px;width:min(94vw,400px)}
  .lcd{font-family:var(--title);font-size:19px;text-align:center;color:var(--green);background:#03140c;border:3px solid #000;
    border-radius:12px;padding:9px 8px;margin-bottom:12px;min-height:46px;text-shadow:0 0 8px rgba(92,255,176,.6);word-break:keep-all}
  .lcd.err{color:var(--red);text-shadow:0 0 8px rgba(255,92,122,.6)}
  .gauge{height:26px;border:3px solid #000;border-radius:14px;background:rgba(0,0,0,.6);overflow:hidden;box-shadow:0 4px 0 #000}
  .gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb703,var(--yellow))}
  .meter{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}
  .meter i{display:block;height:100%;width:0;background:var(--hud);transition:width .08s}
  .label{font-size:16px;color:var(--dim);text-align:center;margin:10px 0 0;word-break:keep-all}
  .dots{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
  .dots i{width:14px;height:14px;border-radius:50%;border:2px solid #000;background:#1b2550}
  .dots i.on{background:var(--green);box-shadow:0 0 8px var(--green)}

  /* 단말기 연결 */
  .lost{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:rgba(20,0,8,.72);padding:0 24px;font-size:20px;word-break:keep-all}
  .lost b{font-family:var(--title);font-weight:normal;font-size:30px;color:var(--red);margin-bottom:8px;text-shadow:0 3px 0 #000}
  #link{position:absolute;right:0;top:0;font-size:13px;padding:3px 9px;border-radius:999px;border:2px solid #000;background:#0c3a26;color:var(--green)}
  #link.off{background:#3a0c16;color:var(--red)}

  /* AR */
  .junk{position:absolute;left:0;top:0;width:104px;height:104px;margin:-52px 0 0 -52px;will-change:transform}
  .junk .float{position:absolute;inset:0;animation:bob 2.6s ease-in-out infinite}
  .junk .glow{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,rgba(255,212,59,.55) 0%,rgba(255,212,59,.18) 45%,rgba(255,212,59,0) 70%);animation:pulse 1.6s ease-in-out infinite}
  .junk .ring{position:absolute;inset:6px;border-radius:50%;border:3px dashed var(--yellow);opacity:.85;animation:spin 6s linear infinite;box-shadow:0 0 14px rgba(255,212,59,.5)}
  .junk .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:48px;line-height:1;filter:drop-shadow(0 0 8px rgba(255,212,59,.9)) drop-shadow(0 3px 0 rgba(0,0,0,.6));animation:wobble 3.4s ease-in-out infinite}
  .junk.haz .glow{background:radial-gradient(circle,rgba(255,60,90,.6) 0%,rgba(255,60,90,.2) 45%,rgba(255,60,90,0) 70%)}
  .junk.haz .ring{border-color:var(--red);box-shadow:0 0 14px rgba(255,60,90,.6)}
  .junk.haz .emo{filter:drop-shadow(0 0 8px rgba(255,60,90,.9)) drop-shadow(0 3px 0 rgba(0,0,0,.6))}
  .junk.got{pointer-events:none}
  .junk.got .float{animation:gone .55s ease-in forwards}
  .rock{position:absolute;left:0;top:0;width:84px;height:84px;margin:-42px 0 0 -42px;will-change:transform;pointer-events:none}
  .rock .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;animation:spin 4s linear infinite;filter:drop-shadow(0 0 10px rgba(255,120,60,.9))}
  .rock.boom .emo{animation:gone .45s ease-in forwards}
  .orb{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;will-change:transform;pointer-events:none}
  .orb .in{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:44px;background:radial-gradient(circle,rgba(124,247,255,.6),rgba(124,247,255,0) 70%);animation:pulse 1s ease-in-out infinite}
  .cross{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none}
  .cross::before,.cross::after{content:"";position:absolute;background:var(--red);box-shadow:0 0 8px var(--red)}
  .cross::before{left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px}
  .cross::after{top:50%;left:0;right:0;height:3px;margin-top:-1.5px}
  .cross i{position:absolute;inset:16px;border:3px solid var(--red);border-radius:50%;box-shadow:0 0 10px var(--red)}
  .cross.hot i{border-color:var(--yellow)}
  .cross svg{position:absolute;inset:-14px;width:112px;height:112px;transform:rotate(-90deg)}
  .laser{position:absolute;left:50%;bottom:0;width:6px;margin-left:-3px;background:linear-gradient(var(--yellow),rgba(255,92,122,0));border-radius:3px;box-shadow:0 0 12px var(--yellow);animation:fade .18s ease-out forwards;pointer-events:none}
  @keyframes fade{from{opacity:1}to{opacity:0}}
  .pop{position:absolute;left:0;top:0;z-index:3;font-family:var(--title);font-size:30px;color:var(--yellow);-webkit-text-stroke:1.5px #000;pointer-events:none;animation:popup .8s ease-out forwards;white-space:nowrap}
  .pop.bad{color:var(--red)}
  @keyframes bob{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
  @keyframes pulse{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.1);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @keyframes gone{0%{transform:scale(1);opacity:1}35%{transform:scale(1.35);opacity:1}100%{transform:scale(0) rotate(200deg);opacity:0}}
  @keyframes popup{0%{transform:translate(-50%,-50%) translateY(0);opacity:1}100%{transform:translate(-50%,-50%) translateY(-60px);opacity:0}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .shake{animation:shakeX .35s}
  #arrow{position:fixed;left:0;top:0;z-index:4;width:54px;height:54px;margin:-27px 0 0 -27px;pointer-events:none;will-change:transform}
  #arrow svg{width:100%;height:100%;filter:drop-shadow(0 0 8px rgba(255,212,59,.8));animation:nudge .9s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}

  /* 배선 */
  .wires{position:relative;height:360px}
  .wires svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .node{position:absolute;width:44px;height:30px;margin-top:-15px;border:3px solid #000;box-shadow:0 3px 0 #000}
  .node.l{left:0;border-radius:4px 10px 10px 4px}
  .node.r{right:0;border-radius:10px 4px 4px 10px}
  .node.on{box-shadow:0 0 14px currentColor,0 3px 0 #000}

  /* 타일 / 패드 / 키 */
  .grid{display:grid;gap:8px}
  .tile{aspect-ratio:1/1;border:3px solid #000;border-radius:12px;background:#1b2550;box-shadow:0 5px 0 #000;
    font-family:var(--title);font-size:28px;color:#fff;display:grid;place-items:center;touch-action:manipulation}
  .tile:active{transform:translateY(5px);box-shadow:0 0 0 #000}
  .tile.hid{color:transparent;background:#24306a}
  .tile.ok{background:#14674a;color:var(--green);box-shadow:0 0 0 #000;transform:translateY(5px)}
  .tile.blank{visibility:hidden}
  .pad{aspect-ratio:1/1;border:3px solid #000;border-radius:12px;background:#16204a;box-shadow:0 4px 0 #000;touch-action:manipulation}
  .pad.lit{background:var(--hud);box-shadow:0 0 20px var(--hud),0 4px 0 #000}
  .pad.lock{pointer-events:none}
  .key{border:3px solid #000;border-radius:12px;background:#dfe7ff;color:#111;box-shadow:0 4px 0 #000;font-family:var(--title);font-size:26px;padding:10px 0;touch-action:manipulation}
  .key:active{transform:translateY(4px);box-shadow:0 0 0 #000}
  .key.sym{font-size:30px;padding:8px 0;background:#26305e}
  .slots{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
  .slots span{width:48px;height:48px;border:3px solid #000;border-radius:10px;background:#0b1230;display:grid;place-items:center;font-size:28px;box-shadow:inset 0 0 0 2px var(--line)}
  .codeshow{font-family:var(--title);font-size:60px;text-align:center;color:var(--yellow);-webkit-text-stroke:2px #000;letter-spacing:6px}
  .syms{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
  .syms span{aspect-ratio:1/1;border-radius:10px;background:#0b1230;border:3px solid #000;display:grid;place-items:center;font-size:30px}

  /* 카드 */
  .slot{position:relative;height:150px;border:3px solid #000;border-radius:16px;background:#0b1230;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
  .slot::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:#000;opacity:.6}
  .card{position:absolute;left:8px;top:16px;width:150px;height:116px;border:3px solid #000;border-radius:12px;background:linear-gradient(135deg,#ffe08a,#ffb703);
    box-shadow:0 4px 0 #000;color:#000;padding:10px;z-index:1;touch-action:none}
  .card b{font-family:var(--title);font-weight:normal;font-size:18px}
  .card .chip{width:34px;height:26px;border-radius:6px;background:#c9a227;border:2px solid #000;margin:8px 0}
  .card small{font-size:13px}

  /* 스캔 */
  .scanbody{position:relative;height:200px;display:grid;place-items:center;overflow:hidden;border-radius:16px;background:#061a24;border:3px solid #000}
  .scanbody .who{font-size:130px;line-height:1;filter:drop-shadow(0 0 14px rgba(124,247,255,.7))}
  .scanbody .bar{position:absolute;left:0;right:0;height:4px;background:var(--hud);box-shadow:0 0 16px 4px rgba(124,247,255,.7);top:10%}
  .scanbody.run .bar{animation:scanmove 1.6s ease-in-out infinite alternate}
  .hand{margin:12px auto 0;width:130px;height:130px;border-radius:50%;border:4px dashed var(--hud);display:grid;place-items:center;font-size:56px;touch-action:none;background:rgba(124,247,255,.06)}
  .hand.on{border-style:solid;background:rgba(124,247,255,.25);box-shadow:0 0 30px rgba(124,247,255,.6)}
  .readout{font-size:15px;color:var(--hud);min-height:60px;margin-top:8px;line-height:1.35}

  canvas.maze{display:block;margin:0 auto;border:3px solid #000;border-radius:10px;box-shadow:0 0 0 2px var(--line)}

  /* 엔진 */
  .engine{font-size:96px;text-align:center;line-height:1.1}
  .light{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;border:4px solid #000;background:#333}
  .light.go{background:#2bff88;box-shadow:0 0 26px #2bff88}
  .light.stop{background:#ff3355;box-shadow:0 0 26px #ff3355}

  /* 산소 */
  .o2{display:flex;gap:18px;justify-content:center;align-items:flex-end}
  .vbar{position:relative;width:70px;height:240px;border:4px solid #000;border-radius:16px;background:#0b1230;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
  .vbar .band{position:absolute;left:0;right:0;background:rgba(92,255,176,.25);border-top:3px dashed var(--green);border-bottom:3px dashed var(--green)}
  .vbar .lv{position:absolute;left:4px;right:4px;height:6px;margin-bottom:-3px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff;bottom:0}
  .vbar.in .lv{background:var(--green);box-shadow:0 0 12px var(--green)}
  .tank{position:relative;width:96px;height:240px;border:4px solid #000;border-radius:36px;background:#0b1230;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
  .tank i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#7cf7ff,#2b7cff)}
  .tank b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--title);font-weight:normal;font-size:24px;z-index:1;text-shadow:0 2px 0 #000}

  /* HUD */
  #hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:calc(var(--sat) + 8px) calc(var(--sar) + 14px) 0 calc(var(--sal) + 14px)}
  #diag{font-size:12px;line-height:1.35;color:var(--hud);background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin-bottom:6px;word-break:keep-all}
  #diag .bad{color:var(--red)} #diag .ok{color:var(--green)}
  .namerow{position:relative;min-height:24px;margin-bottom:4px}
  #mname{font-family:var(--title);font-size:20px;text-shadow:0 2px 0 #000}
  .bar-row{display:flex;align-items:center;gap:10px}
  #count{font-family:var(--title);font-size:24px;color:var(--yellow);-webkit-text-stroke:1px #000;text-shadow:0 3px 0 #000;white-space:nowrap}
  #count small{font-size:17px;color:var(--ink)}
  .progress{flex:1;height:16px;border:3px solid #000;border-radius:10px;background:rgba(0,0,0,.55);overflow:hidden;box-shadow:0 3px 0 #000}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb703,var(--yellow));transition:width .3s cubic-bezier(.3,1.6,.5,1)}
  #timer{font-family:var(--title);font-size:20px;text-shadow:0 2px 0 #000;min-width:52px;text-align:right}
  #timer.low{color:var(--red);animation:pulse .5s ease-in-out infinite}
  #tip{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;text-align:center;padding:0 calc(var(--sar) + 16px) calc(var(--sab) + 14px) calc(var(--sal) + 16px)}
  #tip span{display:inline-block;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-size:16px;line-height:1.35;word-break:keep-all}
  #tip span.warn{border-color:var(--yellow);color:var(--yellow)}

  /* QR 스캔 */
  #scan{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;
    padding:calc(var(--sat) + 60px) calc(var(--sar) + 20px) calc(var(--sab) + 24px) calc(var(--sal) + 20px)}
  #scanBadge{font-size:15px;color:#000;background:var(--yellow);border:2px solid #000;border-radius:999px;padding:3px 12px;margin-bottom:8px}
  #scan h2{margin:0 0 6px;font-family:var(--title);font-weight:normal;font-size:28px;color:var(--yellow);-webkit-text-stroke:1px #000;text-shadow:0 3px 0 #000;text-align:center}
  #scan .sub{margin:0 0 14px;font-size:19px;text-align:center;text-shadow:0 2px 4px #000;word-break:keep-all}
  .frame{position:relative;width:min(62vw,280px);aspect-ratio:1/1}
  .frame::before,.frame::after,.frame i::before,.frame i::after{content:"";position:absolute;width:44px;height:44px;border:5px solid var(--hud);filter:drop-shadow(0 0 6px rgba(124,247,255,.8))}
  .frame::before{left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
  .frame::after{right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
  .frame i::before{left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
  .frame i::after{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
  .frame .scanline{position:absolute;left:8%;right:8%;height:3px;top:10%;border-radius:2px;background:var(--hud);box-shadow:0 0 12px 2px rgba(124,247,255,.8);animation:scanmove 2s ease-in-out infinite alternate}
  @keyframes scanmove{to{top:88%}}
  #scan.cp .frame::before,#scan.cp .frame::after,#scan.cp .frame i::before,#scan.cp .frame i::after{border-color:var(--yellow)}
  #scan.flash .frame::before,#scan.flash .frame::after,#scan.flash .frame i::before,#scan.flash .frame i::after{border-color:var(--green)}
  #scanMsg{margin-top:14px;min-height:30px;font-size:19px;text-align:center;text-shadow:0 2px 4px #000;word-break:keep-all}
  #scanMsg.err{color:var(--red)} #scanMsg.ok{color:var(--green)}
  #scanMsg span{display:inline-block;background:rgba(0,0,0,.6);border-radius:10px;padding:6px 12px}
  #scan .btn{pointer-events:auto;margin-top:10px}

  /* 오버레이 */
  .overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:radial-gradient(ellipse at 50% 20%,#1a2150 0%,#0a0d22 55%,#04050c 100%);
    padding:calc(var(--sat) + 22px) calc(var(--sar) + 20px) calc(var(--sab) + 18px) calc(var(--sal) + 20px);overflow:hidden}
  .overlay.glass{background:rgba(4,6,16,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .overlay.scroll{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .badge{display:inline-block;font-size:14px;letter-spacing:2px;color:var(--hud);border:2px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:12px}
  .overlay h1{margin:0;font-family:var(--title);font-weight:normal;font-size:clamp(36px,11vw,52px);line-height:1.08;color:var(--yellow);-webkit-text-stroke:2px #000;text-shadow:0 5px 0 #000,0 0 30px rgba(255,212,59,.35)}
  .hero{font-size:68px;margin:4px 0 8px;filter:drop-shadow(0 0 14px rgba(255,212,59,.7));animation:bob 2.6s ease-in-out infinite}
  .desc{font-size:19px;line-height:1.45;margin:12px 0 6px;max-width:360px;word-break:keep-all}
  .rules{font-size:16px;line-height:1.45;color:var(--dim);max-width:360px;margin:4px 0 6px;text-align:left;word-break:keep-all}
  .rules div{margin:3px 0}
  .needs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 18px}
  .needs span{font-size:14px;border:2px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--hud)}
  .btn{appearance:none;-webkit-appearance:none;font-family:var(--title);font-size:23px;color:#111;background:var(--yellow);border:4px solid #000;border-radius:18px;
    padding:12px 30px;box-shadow:0 7px 0 #000;transition:transform .06s,box-shadow .06s;cursor:pointer;touch-action:manipulation;text-decoration:none;display:inline-block}
  .btn:active{transform:translateY(7px);box-shadow:0 0 0 #000}
  .btn.ghost{background:#dfe7ff;font-size:16px;padding:8px 16px;border-width:3px;box-shadow:0 5px 0 #000}
  .btn.ghost:active{transform:translateY(5px);box-shadow:0 0 0 #000}
  .btn.big{min-width:220px}
  .btn.full{width:100%}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .env{position:absolute;left:0;right:0;bottom:0;padding:0 calc(var(--sar) + 12px) calc(var(--sab) + 8px) calc(var(--sal) + 12px);font-size:12px;line-height:1.4;color:var(--dim);word-break:keep-all}
  .env .ok{color:var(--green)} .env .bad{color:var(--red)}
  .back{position:absolute;left:calc(var(--sal) + 14px);top:calc(var(--sat) + 12px);font-size:17px;color:var(--dim);text-decoration:none}
  #menu .wrap{width:100%;max-width:520px;padding-bottom:30px}
  .rooms{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
  .chip{border:3px solid #000;border-radius:999px;background:#26305e;color:#fff;font-size:18px;padding:7px 16px;box-shadow:0 4px 0 #000;touch-action:manipulation}
  .chip.on{background:var(--hud);color:#000}

  .mcard:active{transform:translateY(5px);box-shadow:0 0 0 2px var(--line),0 0 0 #000}
  .mcard .e{font-size:32px}

  .mcard small{font-size:13px;color:var(--dim);line-height:1.35;display:block;word-break:keep-all}
  .howto{text-align:left;font-size:16px;line-height:1.5;color:var(--dim);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px;word-break:keep-all}
  .howto b{color:var(--ink);font-weight:normal}
  #doneTime{font-family:var(--title);font-size:56px;color:#fff;-webkit-text-stroke:2px #000;text-shadow:0 5px 0 #000;margin:10px 0 2px}
  #done h1{color:var(--green)}
  #fail h1{color:var(--red)}
  .confetti{position:absolute;top:-30px;font-size:26px;animation:fall linear forwards;pointer-events:none}

</style>
</head>
<body>

  <div class="row"><a class="btn ghost toMenu" href="#">미션 목록</a></div>
</section>

<script>
(() => {
'use strict';

// ===================================================================
// 설정
// ===================================================================
const QR_PREFIX = 'MALLANG-AU:room:';
const ROOMS = [['living','거실'],['room3','침실3'],['balcony','발코니']];
const ROOM_NAMES = Object.fromEntries(ROOMS);
const SPOT_NAMES = { '':'메인 단말기', A:'A 지점', B:'B 지점' };
const VFOV = 62;
const LOST_MS = 2000;
const CATS = { term:'🖥️ 단말기 미션 (QR을 비춘 채로)', move:'📍 이동 미션 (A·B 지점 QR)', duo:'👥 2인 미션' };

const params = new URLSearchParams(location.search);
let room = (params.get('room') || '').trim() || null;
const missionId = params.get('m');
const roomLabel = id => ROOM_NAMES[id] ? `${ROOM_NAMES[id]} (${id})` : id;
const spotLabel = s => `${room ? (ROOM_NAMES[room] || room) + ' ' : ''}${SPOT_NAMES[s]}`;

// ===================================================================
// DOM / 유틸
// ===================================================================
const $ = id => document.getElementById(id);
const cam = $('cam'), stars = $('stars'), stage = $('stage'), arrowEl = $('arrow');
const hud = $('hud'), diag = $('diag'), mname = $('mname'), linkEl = $('link'), progressRow = $('progressRow'), countEl = $('count'), barEl = $('bar'), timerEl = $('timer');
const scan = $('scan'), scanBadge = $('scanBadge'), scanTitle = $('scanTitle'), scanSub = $('scanSub'), scanMsg = $('scanMsg'), skipQr = $('skipQr');
const tip = $('tip'), tipText = $('tipText');

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm360 = a => ((a % 360) + 360) % 360;
const wrap180 = a => { a = norm360(a); return a > 180 ? a - 360 : a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const shuffle = (a, r = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(r() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; };
const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.max(0, s) % 60).padStart(2, '0');
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
function seeded(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function bump(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); clearTimeout(el._bt); el._bt = setTimeout(() => el.classList.remove('shake'), 400); }

// ===================================================================
// 사운드
// ===================================================================
let actx = null;
function unlockAudio(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state === 'suspended') actx.resume();
    const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0);
  } catch(e) {}
}
function tone(freq, start, dur, type='square', vol=0.12, slideTo=null){
  if (!actx) return;
  const t = actx.currentTime + start, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const PAD_F = [262,294,330,392,440,523,587,659,784,880,1047,1175,1319,1568,1760,2093];
const sfx = {
  ok(n=1){ const b = 660 + (n % 8)*50; tone(b,0,.09,'square',.1); tone(b*1.5,.07,.14,'square',.09); },
  click(){ tone(900,0,.05,'square',.06); },
  wrong(){ tone(220,0,.2,'sawtooth',.09,140); },
  scanOk(){ tone(880,0,.08,'sine',.15); tone(1320,.08,.14,'sine',.13); },
  pad(i){ tone(PAD_F[i % 16],0,.25,'triangle',.14); },
  shoot(){ tone(1400,0,.12,'square',.06,300); },
  boom(){ tone(160,0,.3,'sawtooth',.12,50); },
  alarm(){ tone(700,0,.12,'square',.08); tone(500,.14,.12,'square',.08); },
  done(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22,'triangle',.13)); tone(1568,.48,.4,'sine',.1); },
  fail(){ [392,330,262,196].forEach((f,i)=>tone(f,i*.14,.25,'sawtooth',.09)); },
};

// ===================================================================
// 센서 / 카메라 / 마이크
// ===================================================================
const Core = {
  camOk:false, camResult:'-', permResult:'-', micResult:'-', micStream:null,
  ori:{ ok:false, count:0, yaw:0, pitch:0, beta:0, gamma:0 }, motCount:0, view:null,
  W: innerWidth, H: innerHeight,
};
const frameFns = new Set(), motionFns = new Set();
let cur = null, ctx = null, t0 = 0, lastFrame = 0;

window.addEventListener('deviceorientation', e => {
  if (e.alpha == null && e.webkitCompassHeading == null) return;
  const o = Core.ori;
  o.yaw = norm360((typeof e.webkitCompassHeading === 'number' && e.webkitCompassHeading >= 0) ? e.webkitCompassHeading : 360 - (e.alpha || 0));
  o.beta = e.beta || 0; o.gamma = e.gamma || 0; o.pitch = clamp(o.beta - 90, -89, 89);
  o.ok = true; o.count++;
}, true);
let lastAcc = null;
window.addEventListener('devicemotion', e => {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  Core.motCount++;
  let d = 0; if (lastAcc) d = Math.abs(a.x - lastAcc.x) + Math.abs(a.y - lastAcc.y) + Math.abs(a.z - lastAcc.z);
  lastAcc = { x:a.x, y:a.y, z:a.z };
  let iv = e.interval || 16; if (iv < 1) iv *= 1000;
  if (ctx && ctx.paused) return;
  motionFns.forEach(fn => fn(d, iv));
}, true);

function renderDiag(){
  const f = (ok, t) => `<span class="${ok?'ok':'bad'}">${esc(t)}</span>`;
  diag.innerHTML = `카메라 ${f(Core.camOk, Core.camResult)} · 센서권한 ${f(['granted','불필요','안 씀'].includes(Core.permResult), Core.permResult)}` +
    ` · 방향 ${f(Core.ori.count>0, Core.ori.count>0 ? Core.ori.count : '없음')} · 모션 ${f(Core.motCount>0, Core.motCount>0 ? Core.motCount : '없음')}` +
    (cur && cur.needs.includes('mic') ? ` · 마이크 ${f(!!Core.micStream, Core.micResult)}` : '') +
    (Core.view && Core.view.drag ? ' · <b>드래그 모드</b>' : '');
}

// ===================================================================
// 배경
// ===================================================================
const sctx = stars.getContext('2d');
const STARS = Array.from({ length: 260 }, () => ({ yaw: Math.random()*360, pitch: Math.asin(Math.random()*2-1)*180/Math.PI,
  r: Math.random() < .08 ? 1.8 + Math.random() : .5 + Math.random()*1.1, a: .35 + Math.random()*.65, tw: Math.random()*6.28 }));
let driftYaw = 0;
function resize(){ Core.W = innerWidth; Core.H = innerHeight; const dpr = Math.min(devicePixelRatio || 1, 2);
  stars.width = Core.W * dpr; stars.height = Core.H * dpr; sctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
addEventListener('resize', resize); resize();
function drawStars(t, dt){
  if (stars.hidden) return;
  const W = Core.W, H = Core.H, hfov = VFOV * W / H;
  let vy, vp; if (Core.view) { vy = Core.view.yaw; vp = Core.view.pitch; } else { driftYaw += dt * 2; vy = driftYaw; vp = 0; }
  sctx.clearRect(0, 0, W, H);
  for (const s of STARS) {
    const dy = wrap180(s.yaw - vy), dp = s.pitch - vp;
    if (Math.abs(dy) > hfov*.6 || Math.abs(dp) > VFOV*.6) continue;
    sctx.globalAlpha = s.a * (.7 + .3*Math.sin(t/600 + s.tw)); sctx.fillStyle = '#fff';
    sctx.beginPath(); sctx.arc(W/2 + dy/hfov*W, H/2 - dp/VFOV*H, s.r, 0, 6.283); sctx.fill();
  }
  sctx.globalAlpha = 1;
}
// 'cam' = 카메라, 'term' = 어둡게 한 카메라(단말기), 'stars' = 우주
function setBg(mode){
  const camOn = Core.camOk && mode !== 'stars';
  cam.hidden = !camOn; stars.hidden = camOn;
  document.body.classList.toggle('term', camOn && mode === 'term');
}

// ===================================================================
// QR: 카메라 프레임을 계속 읽어서 지금 듣고 있는 쪽(qrSink)에 넘김
// ===================================================================
const qrCanvas = document.createElement('canvas'), qrCtx = qrCanvas.getContext('2d', { willReadFrequently: true });
let qrSink = null;
function parseQr(text){
  if (!text.startsWith(QR_PREFIX)) return null;
  const [r, s] = text.slice(QR_PREFIX.length).trim().split(':');
  return { room: r, spot: (s || '').toUpperCase() };
}
function qrLoop(){
  setTimeout(qrLoop, 170);
  if (!qrSink || !Core.camOk || !cam.videoWidth || cam.readyState < 2 || typeof window.jsQR !== 'function') return;
  const vw = cam.videoWidth, vh = cam.videoHeight, sc = Math.min(1, 640 / Math.max(vw, vh)), w = Math.round(vw*sc), hh = Math.round(vh*sc);
  if (qrCanvas.width !== w) qrCanvas.width = w; if (qrCanvas.height !== hh) qrCanvas.height = hh;
  qrCtx.drawImage(cam, 0, 0, w, hh);
  let code = null; try { code = jsQR(qrCtx.getImageData(0, 0, w, hh).data, w, hh, { inversionAttempts: 'attemptBoth' }); } catch(e) {}
  if (code && code.data && qrSink) qrSink(code.data.trim());
}

// QR 찍기 화면 (시작 / 체크포인트 공용)
function scanFor(spot, title, sub, badge){
  return new Promise(resolve => {
    showTip(''); arrowEl.hidden = true;
    setBg('cam');
    scan.hidden = false; scan.classList.toggle('cp', !!badge); scan.classList.remove('flash');
    scanBadge.hidden = !badge; scanBadge.textContent = badge || '';
    scanTitle.textContent = title; scanSub.innerHTML = sub;
    let lastMsg = 0, finished = false;
    const msg = (t, cls) => { scanMsg.className = cls || ''; scanMsg.innerHTML = t ? `<span>${t}</span>` : ''; };
    msg(Core.camOk ? '' : '카메라를 못 켜서 QR을 찍을 수 없어요', Core.camOk ? '' : 'err');
    if (Core.camOk && typeof window.jsQR !== 'function') msg('QR 인식 라이브러리를 못 불러왔어요 (네트워크 확인)', 'err');
    const finish = () => {
      if (finished) return; finished = true; qrSink = null; skipQr.onclick = null;
      sfx.scanOk(); scan.classList.add('flash'); msg('확인!', 'ok');
      setTimeout(() => { scan.hidden = true; resolve(); }, 450);
    };
    qrSink = text => {
      const now = performance.now(), q = parseQr(text);
      const say = (t, bad) => { if (now - lastMsg > 1500) { lastMsg = now; if (bad) sfx.wrong(); msg(t, 'err'); } };
      if (!q) return say('말랑 방 QR이 아니에요');
      if (!room && q.spot === '') room = q.room;
      if (q.room !== room) return say(`여기가 아니에요! 찍은 곳: ${esc(roomLabel(q.room))}<br>가야 할 곳: ${esc(roomLabel(room))}`, true);
      if (q.spot !== spot) return say(`이건 ${esc(SPOT_NAMES[q.spot] || q.spot)} QR이에요.<br>${esc(SPOT_NAMES[spot])} QR을 찾으세요`, true);
      finish();
    };
    skipQr.onclick = () => { unlockAudio(); if (!room) room = 'room3'; finish(); };
  });
}

// ===================================================================
// HUD
// ===================================================================
function setProgress(n, total, unit){ progressRow.hidden = false; countEl.innerHTML = `${n} <small>/ ${total}${unit ? ' ' + unit : ''}</small>`; barEl.style.width = clamp(n / total * 100, 0, 100) + '%'; }
function setGauge(p, label){ progressRow.hidden = false; countEl.innerHTML = `${label ? `<small>${label}</small> ` : ''}${Math.floor(clamp(p,0,1)*100)}<small>%</small>`; barEl.style.width = clamp(p*100, 0, 100) + '%'; }
function showTip(text, warn){ if (!text) { tip.hidden = true; return; } tip.hidden = false; tipText.textContent = text; tipText.className = warn ? 'warn' : ''; }

// ===================================================================
// 미션 컨텍스트
// ===================================================================
function makeCtx(){
  const cleanups = [];
  const el = document.createElement('div'); el.className = 'layer'; stage.appendChild(el);
  const c = {
    el, paused:false, finished:false, limit:0, active:0, term:null,
    onFrame(fn){ frameFns.add(fn); cleanups.push(() => frameFns.delete(fn)); },
    onMotion(fn){ motionFns.add(fn); cleanups.push(() => motionFns.delete(fn)); },
    listen(t, ev, fn, opt){ t.addEventListener(ev, fn, opt); cleanups.push(() => t.removeEventListener(ev, fn, opt)); },
    later(fn, ms){ const id = setTimeout(() => { if (!c.finished) fn(); }, ms); cleanups.push(() => clearTimeout(id)); return id; },
    addCleanup(fn){ cleanups.push(fn); },
    progress: setProgress, gauge: setGauge, tip: showTip,
    center(html){ const x = h(`<div class="center">${html}</div>`); el.appendChild(x); return x; },
    setLimit(sec){ c.limit = sec; c.active = 0; },
    done(){ if (c.finished) return; c.finished = true; finishMission(); },
    fail(msg){ if (c.finished) return; c.finished = true; failMission(msg); },
    // 체크포인트: 다른 지점 QR 찍기 (그동안 시간 멈춤)
    async checkpoint(spot, title, sub){
      c.paused = true; el.style.visibility = 'hidden';
      const tipWas = tip.hidden ? '' : tipText.textContent;
      sfx.alarm();
      await scanFor(spot, title, sub || `<b style="color:var(--yellow)">${esc(spotLabel(spot))}</b> QR을 찾아 찍으세요`, `📍 이동: ${SPOT_NAMES[spot]}`);
      if (c.finished) return;
      el.style.visibility = ''; c.paused = false;
      setBg(c.term != null ? 'term' : (cur.ar ? 'cam' : 'stars'));
      if (c.term != null) c.terminal(c.term);
      if (tipWas) showTip(tipWas);
    },
    // 단말기: 이 지점 QR이 카메라에 보이는 동안만 조작 가능
    terminal(spot){
      c.term = spot; c.seenAt = performance.now(); c.ignoreLink = false;
      setBg('term');
      if (!c.lostEl) {
        c.lostEl = h(`<div class="lost" hidden><b>📡 신호 끊김</b><div></div><button class="btn ghost" style="margin-top:18px">QR 확인 끄기 (테스트용)</button></div>`);
        c.lostEl.querySelector('button').onclick = () => { c.ignoreLink = true; };
        el.appendChild(c.lostEl);
      }
      c.lostEl.querySelector('div').innerHTML = `${esc(spotLabel(spot))} QR을<br>카메라로 다시 비추세요`;
      qrSink = text => { const q = parseQr(text); if (q && q.room === room && q.spot === spot) c.seenAt = performance.now(); };
      linkEl.hidden = false;
    },
    linked(){ return c.term == null || c.ignoreLink || !Core.camOk || performance.now() - c.seenAt < LOST_MS; },
    cleanup(){ cleanups.splice(0).forEach(f => { try { f(); } catch(e){} }); el.remove(); arrowEl.hidden = true; Core.view = null; qrSink = null; linkEl.hidden = true; document.body.classList.remove('term'); },
  };
  c.onFrame(() => {
    if (c.term == null) return;
    const ok = c.linked();
    if (c.lostEl && c.lostEl.hidden !== ok) { c.lostEl.hidden = ok; if (!ok) sfx.wrong(); }
    linkEl.className = ok ? '' : 'off';

// AR 시점
function arView(c){
  const v = { yaw:0, pitch:0, base:0, drag:false, moved:0, startCount: Core.ori.count };
  if (Core.ori.ok) { v.base = v.yaw = Core.ori.yaw; v.pitch = Core.ori.pitch; } else { v.drag = true; v.pitch = 5; }
  Core.view = v;
  let d = null;
  c.listen(c.el, 'pointerdown', e => { d = { x:e.clientX, y:e.clientY, id:e.pointerId }; v.moved = 0; });
  c.listen(window, 'pointermove', e => {
    if (!d || e.pointerId !== d.id) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y; d.x = e.clientX; d.y = e.clientY;
    v.moved += Math.abs(dx) + Math.abs(dy);
    if (!v.drag) return;
    v.yaw = norm360(v.yaw - dx * v.hfov() / Core.W); v.pitch = clamp(v.pitch + dy * VFOV / Core.H, -70, 70);
  });
  c.listen(window, 'pointerup', e => { if (d && e.pointerId === d.id) d = null; });
  v.hfov = () => VFOV * Core.W / Core.H;
  v.update = () => {
    if (v.drag && Core.ori.ok && Core.ori.count > v.startCount + 3) {
      const rel = v.yaw - v.base; v.drag = false; v.base = norm360(Core.ori.yaw - rel); v.yaw = Core.ori.yaw; v.pitch = Core.ori.pitch; c.onSwitch && c.onSwitch();
    }
    if (!v.drag) { v.yaw = norm360(v.yaw + wrap180(Core.ori.yaw - v.yaw) * 0.22); v.pitch += (Core.ori.pitch - v.pitch) * 0.22; }
  };
  v.project = (yaw, pitch) => {
    const hf = v.hfov(), dyaw = wrap180(yaw - v.yaw), dpitch = pitch - v.pitch;
    const x = Core.W/2 + dyaw/hf*Core.W, y = Core.H/2 - dpitch/VFOV*Core.H;
    return { x, y, dyaw, dpitch, vis: Math.abs(dyaw) < hf*.5 + 15 && Math.abs(dpitch) < VFOV*.5 + 15, onScreen: x > 20 && x < Core.W - 20 && y > 116 && y < Core.H - 80 };
  };
  v.dragTip = '센서가 안 잡혀요 👆 화면을 끌어서 둘러보세요';
  return v;
}
function pointArrow(target){
  if (!target) { arrowEl.hidden = true; return; }
  const v = Core.view, hf = v.hfov();
  const ang = Math.atan2(-target.dpitch / VFOV * Core.H, target.dyaw / hf * Core.W);
  const top = 130, bottom = 90, cx = Core.W/2, cy = (top + Core.H - bottom)/2, hw = Core.W/2 - 40, hh = (Core.H - bottom - top)/2 - 10;
  const k = Math.min(hw / Math.abs(Math.cos(ang) || 1e-6), hh / Math.abs(Math.sin(ang) || 1e-6));
  arrowEl.hidden = false;
  arrowEl.style.transform = `translate3d(${(cx + Math.cos(ang)*k).toFixed(1)}px,${(cy + Math.sin(ang)*k).toFixed(1)}px,0) rotate(${ang}rad)`;
}
function popText(parent, x, y, text, bad){ const p = h(`<div class="pop ${bad ? 'bad' : ''}">${esc(text)}</div>`); p.style.left = x + 'px'; p.style.top = y + 'px'; parent.appendChild(p); setTimeout(() => p.remove(), 800); }
function holdButton(label){
  const b = h(`<button class="btn full" style="margin-top:12px">${esc(label)}</button>`); b.holding = false;
  const on = e => { e.preventDefault(); b.holding = true; b.style.transform = 'translateY(7px)'; b.style.boxShadow = '0 0 0 #000'; };
  const off = () => { b.holding = false; b.style.transform = ''; b.style.boxShadow = ''; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  return b;
}

      if (!best) return;
      best.dead = true; best.el.classList.add('boom'); sfx.boom(); popText(c.el, best.x, best.y - 30, '💥'); const bel = best.el; setTimeout(() => bel.remove(), 500);
      hit++; c.progress(hit, PER * 2);
      if (hit >= PER * wave) { armed = false; return; }
      if (rocks.filter(r => !r.dead).length < Math.min(ALIVE, PER * wave - hit)) setTimeout(spawn, 350);
    });
    c.onFrame((t, dt) => {
      v.update();
      let nearest = null, nd = Infinity, any = false, hot = false;
      for (const r of rocks) {
        if (r.dead) continue;
        r.yaw = norm360(r.yaw + r.vy * dt); r.pitch += r.vp * dt; if (r.pitch > 35 || r.pitch < -20) r.vp *= -1;
        if (Math.abs(wrap180(r.yaw - v.yaw)) > 85) { r.dead = true; r.el.remove(); if (armed) spawn(); continue; }
        const p = v.project(r.yaw, r.pitch); r.x = p.x; r.y = p.y;
        r.el.style.transform = p.vis ? `translate3d(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px,0)` : 'translate3d(-9999px,0,0)';
        if (p.onScreen) any = true; else { const d = Math.hypot(p.dyaw, p.dpitch); if (d < nd) { nd = d; nearest = p; } }
        if (Math.hypot(p.x - Core.W/2, p.y - Core.H/2) < 56) hot = true;
      }
      cross.classList.toggle('hot', hot);
      pointArrow(any || !armed ? null : nearest);
    });
    c.progress(0, PER * 2);
    for (wave = 1; wave <= 2; wave++) {
      if (wave === 2) {
        rocks.forEach(r => r.el.remove()); rocks = []; arrowEl.hidden = true;
        await c.checkpoint('B', '포탑 재장전'); if (c.finished) return;
      }
      tipNow(); c.setLimit(25); armed = true;
      for (let i = 0; i < ALIVE; i++) spawn();
      await new Promise(resolve => { const iv = setInterval(() => { if (hit >= PER * wave || c.finished) { clearInterval(iv); resolve(); } }, 100); c.addCleanup(() => clearInterval(iv)); });
      if (c.finished) return;
      c.setLimit(0); sfx.ok(6);
    }
    c.done();
  }
});

// ---------- 👥 암호 전달 (전달자=메인, 입력자=A) ----------
M({ id:'code', cat:'duo', icon:'🗝️', name:'암호 전달', needs:[],
  desc:'2인 미션! 전달자는 메인 단말기에서 기호 6개를 보고 말로만 설명하고, 입력자는 A 지점 단말기에서 듣고 입력해요. 서로 떨어져서 큰 소리로!',
  rules:['🖥️ 전달자 = 메인 단말기 QR', '🖥️ 입력자 = A 지점 단말기 QR', '❌ 3번 틀리면 실패'],
  start(c){
    const SY = ['🔴','🟠','🟡','🟢','🔵','🟣','🟥','🟧','🟨','🟩','🟦','🟪'];
    const roomHash = [...(room || 'x')].reduce((a, ch) => a * 31 + ch.charCodeAt(0) | 0, 7);
    const ansOf = set => shuffle(SY.slice(), seeded(set * 7919 + roomHash)).slice(0, 6);
    const confirmOf = set => String((set * 37 + 11 + Math.abs(roomHash) % 97) % 900 + 100);
    const box = c.center(`<div class="panel"></div>`).firstElementChild;
    c.progress(0, 2);
    function digitPad(len, onDone, title){
      box.innerHTML = `<div class="lcd">${title}</div><div class="slots">${'<span></span>'.repeat(len)}</div>
        <div class="grid" style="grid-template-columns:repeat(3,1fr)">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✔'].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}</div>`;
      const slots = box.querySelectorAll('.slots span'), lcd = box.querySelector('.lcd'); let s = '';
      box.querySelectorAll('.key').forEach(b => b.addEventListener('click', () => {
        const k = b.dataset.k; sfx.click();
        if (k === '⌫') s = s.slice(0, -1); else if (k === '✔') { if (s.length === len && !onDone(s, lcd)) s = ''; } else if (s.length < len) s += k;
        slots.forEach((el, i) => el.textContent = s[i] || '');
      }));
    }
    function chooseRole(){
      box.innerHTML = `<div class="lcd">역할을 고르세요</div>
        <button class="btn full" id="rS">📢 전달자<br><small style="font-family:var(--body);font-size:15px">메인 단말기 · 기호를 보고 말로 설명</small></button>
        <div style="height:16px"></div>
        <button class="btn full" id="rR" style="background:var(--hud)">⌨️ 입력자<br><small style="font-family:var(--body);font-size:15px">A 지점 단말기 · 듣고 입력</small></button>`;
      box.querySelector('#rS').onclick = () => { sfx.click(); sender(); };
      box.querySelector('#rR').onclick = async () => { sfx.click(); box.innerHTML = ''; await c.checkpoint('A', '입력 단말기로 이동'); if (!c.finished) receiver(); };
      c.tip('두 사람이 서로 다른 역할을 고르세요');
    }
    function sender(){
      c.terminal('');
      const set = 10 + Math.floor(Math.random() * 90), ans = ansOf(set);
      box.innerHTML = `<div class="lcd">입력자에게 세트 번호를 불러 주세요</div><div class="codeshow">${set}</div>
        <div class="label" style="margin:0 0 4px">아래 6개를 순서대로 말로만 설명! (화면 보여주기 금지)</div>
        <div class="syms">${ans.map(s => `<span>${s}</span>`).join('')}</div>
        <button class="btn full" id="toConfirm" style="margin-top:10px">입력자가 맞혔어요 → 확인 코드 입력</button>`;
      c.progress(1, 2); c.tip('예: "첫 번째는 초록 네모"');
      box.querySelector('#toConfirm').onclick = () => {
        sfx.click();
        digitPad(3, (s, lcd) => {
          if (s === confirmOf(set)) { sfx.ok(4); lcd.textContent = '통신 성공!'; c.progress(2, 2); c.later(() => c.done(), 500); return true; }
          sfx.wrong(); lcd.textContent = '확인 코드가 달라요'; lcd.className = 'lcd err'; return false;
        }, '입력자 화면의 확인 코드 3자리');
      };
    }
    function receiver(){
      c.terminal('A');
      digitPad(2, s => { symbolInput(parseInt(s, 10)); return true; }, '전달자가 부른 세트 번호');
      c.tip('전달자에게 세트 번호를 물어보세요');
    }
    function symbolInput(set){
      const ans = ansOf(set); let cur6 = [], errs = 0;
      box.innerHTML = `<div class="lcd">세트 ${set} · 듣고 순서대로 6개</div><div class="slots">${'<span></span>'.repeat(6)}</div>
        <div class="grid" style="grid-template-columns:repeat(4,1fr)">${SY.map(k => `<button class="key sym" data-k="${k}">${k}</button>`).join('')}</div>
        <div class="row"><button class="btn ghost" id="clr">지우기</button><span class="label" id="lv" style="margin:8px 0 0">목숨 ❤️❤️❤️</span></div>`;
      const slots = box.querySelectorAll('.slots span'), lcd = box.querySelector('.lcd'), lv = box.querySelector('#lv');
      const render = () => slots.forEach((el, i) => el.textContent = cur6[i] || '');
      box.querySelector('#clr').onclick = () => { cur6 = []; render(); };
      box.querySelectorAll('.key').forEach(b => b.addEventListener('click', () => {
        if (cur6.length >= 6) return; sfx.click(); cur6.push(b.dataset.k); render();
        if (cur6.length < 6) return;
        if (cur6.join('') === ans.join('')) {
          sfx.ok(4); c.progress(1, 2);
          box.innerHTML = `<div class="lcd">정답! 전달자에게 이 코드를 불러 주세요</div><div class="codeshow">${confirmOf(set)}</div>
            <button class="btn full" id="fin" style="margin-top:14px">불러 줬어요 → 완료</button>`;
          box.querySelector('#fin').onclick = () => { c.progress(2, 2); c.done(); };
        } else {
          errs++; sfx.wrong(); bump(box); lv.textContent = '목숨 ' + '❤️'.repeat(3 - errs) + '🖤'.repeat(errs);
          if (errs >= 3) { c.fail('3번 틀렸어요'); return; }
          lcd.textContent = '틀렸어요! 다시 들어 보세요'; lcd.className = 'lcd err';
          setTimeout(() => { cur6 = []; render(); lcd.className = 'lcd'; lcd.textContent = `세트 ${set} · 듣고 순서대로 6개`; }, 700);
        }
      }));
    }
    chooseRole();
  }
});

const NEED_LABEL = { cam:'📷 카메라', motion:'📱 센서', mic:'🎤 마이크' };

// ===================================================================
// 화면 흐름
// ===================================================================
const urlFor = (r, m) => `?${new URLSearchParams(Object.assign({}, r ? { room: r } : {}, m ? { m } : {}))}`;

function showMenu(){
  $('menu').hidden = false;
  const chips = $('roomChips'); chips.innerHTML = '';
  let sel = room || 'room3';
  ROOMS.forEach(([id, name]) => {
    const b = h(`<button class="chip ${id === sel ? 'on' : ''}">${esc(name)}</button>`);
    b.onclick = () => { sel = id; chips.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); b.classList.add('on'); renderList(); };
    chips.appendChild(b);
  });
  function renderList(){
    const list = $('menuList'); list.innerHTML = '';
    Object.entries(CATS).forEach(([cat, label]) => {
      const ms = MISSIONS.filter(m => m.cat === cat); if (!ms.length) return;
      list.appendChild(h(`<div class="cat">${label}</div>`));
      const g = h(`<div class="cards"></div>`);
      ms.forEach(m => g.appendChild(h(`<a class="mcard" href="${urlFor(sel, m.id)}"><div class="e">${m.icon}</div><b>${esc(m.name)}</b><small>${m.rules.map(esc).join('<br>')}</small></a>`)));
      list.appendChild(g);
    });
  }
  renderList();
  $('randomBtn').onclick = () => { const m = MISSIONS[Math.floor(Math.random() * MISSIONS.length)]; location.href = urlFor(sel, m.id); };
}

function showIntro(m){
  cur = m; document.title = m.name + ' · 말랑 미션';
  $('intro').hidden = false;
  $('introCat').textContent = CATS[m.cat].split(' (')[0];
  $('introIcon').textContent = m.icon; $('introName').textContent = m.name;
  $('introDesc').innerHTML = esc(m.desc) + (room ? `<br><span style="color:var(--hud)">장소: ${esc(roomLabel(room))}</span>` : '');
  $('introRules').innerHTML = m.rules.map(r => `<div>${esc(r)}</div>`).join('');
  $('introNeeds').innerHTML = ['📷 QR 카메라'].concat(m.needs.filter(n => n !== 'cam').map(n => NEED_LABEL[n])).map(t => `<span>${t}</span>`).join('');
  $('backLink').href = urlFor(room, null);
  document.querySelectorAll('.toMenu').forEach(a => a.href = urlFor(room, null));
  let inIframe; try { inIframe = window.self !== window.top; } catch(e) { inIframe = true; }
  const gum = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), doe = typeof window.DeviceOrientationEvent !== 'undefined';
  const f = (ok, t) => `<span class="${ok?'ok':'bad'}">${t}</span>`;
  $('env').innerHTML = `환경 점검 · iframe ${inIframe ? f(false,'안쪽') : f(true,'아님')} · isSecureContext ${f(window.isSecureContext, String(window.isSecureContext))}` +
    ` · getUserMedia ${f(gum, gum?'지원':'없음')} · DeviceOrientationEvent ${f(doe, doe ? (typeof DeviceOrientationEvent.requestPermission === 'function' ? '지원(권한 필요)' : '지원') : '없음')}`;
}

$('startBtn').addEventListener('click', () => {
  const m = cur; unlockAudio();
  const useMotion = m.needs.includes('motion');
  const PermAPI = (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') ? DeviceOrientationEvent
    : (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') ? DeviceMotionEvent : null;
  let permP;
  if (useMotion && PermAPI) { try { permP = PermAPI.requestPermission().then(r => r, e => '에러:' + (e && e.name || e)); } catch(e) { permP = Promise.resolve('에러:' + e.name); } }
  else permP = Promise.resolve(useMotion ? (typeof DeviceOrientationEvent !== 'undefined' ? '불필요' : '미지원') : '안 씀');
  const camP = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    ? navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
    : Promise.reject({ name: window.isSecureContext ? 'getUserMedia 없음' : 'https 아님' });
  const micP = m.needs.includes('mic') && navigator.mediaDevices && navigator.mediaDevices.getUserMedia
    ? navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false }) : null;
  $('startBtn').disabled = true; $('startBtn').textContent = '준비 중…';
  permP.then(r => Core.permResult = r);
  if (micP) micP.then(s => { Core.micStream = s; Core.micResult = '허용'; }, e => { Core.micResult = (e && e.name) || '실패'; }); else Core.micResult = '안 씀';
  camP.then(stream => { cam.srcObject = stream; const p = cam.play(); if (p && p.catch) p.catch(() => {}); Core.camOk = true; Core.camResult = '허용'; },
            err => { Core.camOk = false; Core.camResult = (err && err.name) || String(err); })
  .finally(() => Promise.all([permP, micP ? micP.catch(() => {}) : null]).then(() => {
    $('intro').hidden = true; hud.hidden = false; mname.textContent = `${m.icon} ${m.name}`;
    renderDiag(); setInterval(renderDiag, 500);
    qrLoop(); requestAnimationFrame(loop);
    gate();
  }));
});

async function gate(){
  if (ctx) { ctx.cleanup(); ctx = null; }
  progressRow.hidden = true; timerEl.className = '';
  await scanFor('', '메인 단말기 QR을 찍으세요',
    room ? `<b style="color:var(--hud)">${esc(roomLabel(room))}</b> 메인 단말기 QR을 네모 안에 비춰 주세요` : '미션을 할 방의 메인 단말기 QR을 비춰 주세요');
  setBg(cur.ar ? 'cam' : 'stars');
  t0 = performance.now();
  ctx = makeCtx(); ctx.setLimit(cur.limit || 0);
  try { await cur.start(ctx); } catch(e) { showTip('미션 오류: ' + e.message, true); console.error(e); }
}

function finishMission(){
  const sec = Math.round((performance.now() - t0) / 1000);
  sfx.done();
  setTimeout(() => {
    if (ctx) { ctx.cleanup(); ctx = null; }
    showTip('');
    $('doneTime').textContent = fmtTime(sec);
    $('doneName').textContent = `${cur.icon} ${cur.name} · 걸린 시간`;
    const d = $('done'); d.hidden = false;
    const items = ['⭐','✨','🌟','💫', cur.icon];
    for (let i = 0; i < 24; i++) { const x = h(`<div class="confetti">${items[i % items.length]}</div>`); x.style.left = Math.random()*100 + '%';
      x.style.animationDuration = (2.2 + Math.random()*2) + 's'; x.style.animationDelay = Math.random()*.8 + 's'; d.appendChild(x); }
  }, 300);
}
function failMission(msg){
  sfx.fail();
  setTimeout(() => {
    if (ctx) { ctx.cleanup(); ctx = null; }
    showTip(''); $('failMsg').textContent = msg; $('fail').hidden = false;
  }, 250);
}
$('againBtn').addEventListener('click', () => { unlockAudio(); const d = $('done'); d.hidden = true; d.querySelectorAll('.confetti').forEach(x => x.remove()); gate(); });
$('retryBtn').addEventListener('click', () => { unlockAudio(); $('fail').hidden = true; gate(); });

let lastSec = -1;
function loop(t){
  requestAnimationFrame(loop);
  const dt = lastFrame ? Math.min((t - lastFrame) / 1000, 0.1) : 0.016; lastFrame = t;
  drawStars(t, dt);
  if (ctx && !ctx.paused) frameFns.forEach(fn => fn(t, dt));
  if (ctx && !ctx.finished && !ctx.paused) {
    ctx.active += dt;
    let s;
    if (ctx.limit) {
      const left = Math.ceil(ctx.limit - ctx.active); s = left;
      timerEl.className = left <= 10 ? 'low' : '';
      if (left !== lastSec && left <= 5 && left > 0) tone(1000, 0, .06, 'square', .06);
      if (ctx.active >= ctx.limit) ctx.fail('시간 초과!');
    } else { s = Math.floor((performance.now() - t0) / 1000); timerEl.className = ''; }
    if (s !== lastSec) { lastSec = s; timerEl.textContent = (ctx.limit ? '⏱' : '') + fmtTime(Math.max(0, s)); }
  }
}

document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouch < 300 && !e.target.closest('.key,.tile,.pad,.btn,.mcard,.chip')) e.preventDefault(); lastTouch = n; }, { passive: false });

const found = MISSIONS.find(m => m.id === missionId);
if (found) showIntro(found); else { showMenu(); requestAnimationFrame(loop); }
})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>펜션 살리기 QR 인쇄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&display=swap" rel="stylesheet">
<!-- QR 생성: qrcodejs 1.0.0 (버전 고정) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  [hidden]{display:none!important}
  :root{
    --bg:#1b130e; --ink:#fff4e6; --dim:#cdb69c; --hud:#ffcf6b; --yellow:#ffd43b;
    --title:'Black Han Sans','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    --body:'Do Hyeon','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:radial-gradient(ellipse at 50% 0%,#4a3222 0%,#22170f 50%,#0e0906 100%) fixed,var(--bg);
    color:var(--ink);font-family:var(--body)}
  main{max-width:760px;margin:0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-right,0px) + 16px)
            calc(env(safe-area-inset-bottom,0px) + 40px) calc(env(safe-area-inset-left,0px) + 16px)}
  header{text-align:center;margin-bottom:18px}
  .badge{display:inline-block;font-size:14px;letter-spacing:2px;color:var(--hud);border:2px solid rgba(255,207,107,.5);border-radius:999px;padding:4px 12px;margin-bottom:12px}
  h1{margin:0 0 8px;font-family:var(--title);font-weight:normal;font-size:40px;color:var(--yellow);-webkit-text-stroke:1.5px #000;text-shadow:0 4px 0 #000}
  header p{margin:0 0 16px;font-size:18px;color:var(--dim);line-height:1.45;word-break:keep-all}
  header p b{color:var(--ink);font-weight:normal}
  .btn{appearance:none;-webkit-appearance:none;font-family:var(--title);font-size:22px;color:#111;background:var(--yellow);border:4px solid #000;border-radius:16px;
    padding:12px 30px;box-shadow:0 7px 0 #000;cursor:pointer;transition:transform .06s,box-shadow .06s;touch-action:manipulation}
  .btn:active{transform:translateY(7px);box-shadow:0 0 0 #000}
  .guide{text-align:left;font-size:16px;line-height:1.55;color:var(--dim);border:2px solid rgba(255,207,107,.5);border-radius:14px;padding:10px 14px;margin:0 auto 18px;word-break:keep-all}
  .guide b{color:var(--ink);font-weight:normal}

  /* 한 장 시트: 2열, 점선 = 자르는 선 */
  .sheet{background:#fff;color:#111;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;box-shadow:0 8px 0 #000;border:3px solid #000}
  .cell{border-right:2px dashed #999;border-bottom:2px dashed #999;padding:12px 8px 10px;text-align:center;position:relative}
  .cell:nth-child(2n){border-right:0}
  .cell.door{background:#fff7e3}
  .cell .tag{font-size:12px;color:#777}
  .cell h2{margin:2px 0 4px;font-family:var(--title);font-weight:normal;font-size:26px;line-height:1.1}
  .cell .kind{display:inline-block;font-size:13px;border:2px solid #111;border-radius:999px;padding:1px 9px;margin-bottom:6px}
  .cell.door .kind{background:#ffcf6b}
  .qr{display:flex;justify-content:center}
  .qr img,.qr canvas{width:min(36vw,7cm)!important;height:min(36vw,7cm)!important;image-rendering:pixelated}
  .where{font-size:13px;color:#333;margin-top:6px;word-break:keep-all}
  .where span{display:inline-block;min-width:90px;border-bottom:2px dashed #b08a5a;padding:0 4px;outline:none;color:#000}
  .where span:focus{background:#fff1c9}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#888;margin-top:3px}
  .cut{position:absolute;top:-11px;left:-9px;font-size:16px;color:#999}
  .links{margin-top:18px;text-align:center;font-size:15px;color:var(--dim);line-height:1.8}
  .links a{color:var(--hud)}

  @media print{
    @page{size:A4;margin:8mm}
    html,body{background:#fff!important;color:#000}
    header,.guide,.links,.noprint{display:none!important}
    main{padding:0;max-width:none}
    .sheet{box-shadow:none;border:0;border-radius:0;border-top:1px dashed #999;border-left:1px dashed #999}
    .cell{height:90mm;overflow:hidden;padding:3mm 3mm 1mm;border-right:1px dashed #999;border-bottom:1px dashed #999;break-inside:avoid;page-break-inside:avoid}
    .cell:nth-child(2n){border-right:1px dashed #999}
    .cell h2{font-size:18pt;margin:0 0 1mm}
    .cell .tag{font-size:8pt}
    .cell .kind{font-size:9pt;margin-bottom:1.5mm}
    .where{margin-top:1mm;font-size:9pt}
    .code{display:none}
    .qr img,.qr canvas{width:6cm!important;height:6cm!important}
    .where span{border-bottom-color:transparent}
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="badge">🏠 펜션 살리기 · QR 인쇄</div>
    <h1>방 QR 한 장 인쇄</h1>
    <p>방마다 <b>메인 QR</b> + <b>문 QR</b> 2장씩, 3개 방 =<br><b>A4 한 장에 6개</b>. 인쇄해서 점선대로 잘라 쓰세요 ✂️</p>
    <button class="btn" onclick="window.print()">인쇄하기</button>
  </header>
  <div class="guide">
    📌 붙이는 법<br>
    · <b>메인 QR</b>: 그 방 가운데쯤 눈높이 벽 (미션 시작)<br>
    · <b>문 QR</b>: 그 방 <b>문 안쪽</b> 눈높이 (이동 미션 중간 지점, 노크·문 잠그기)<br>
    · 빛 반사 없는 곳에, 구겨지지 않게 테이프로<br>
    ✏️ 아래 <b>방 이름</b>과 <b>'붙일 곳'</b>을 눌러 실제 펜션에 맞게 고친 뒤 인쇄해도 돼요
  </div>
  <div class="sheet" id="sheet"></div>
  <p class="noprint" id="libErr" hidden style="text-align:center;color:#ff6b6b">QR 생성 라이브러리를 못 불러왔어요. 네트워크를 확인하고 새로고침해 주세요.</p>
  <div class="links" id="links"></div>
</main>
<script>
(() => {
  const ROOMS = [
    { id: 'living',  name: '거실' },
    { id: 'room3',   name: '침실3' },
    { id: 'balcony', name: '발코니' },
  ];
  const SPOTS = [
    { s: '',  kind: '🏁 메인 QR', where: '방 가운데 눈높이 벽', cls: '' },
    { s: 'D', kind: '🚪 문 QR',   where: '방 문 안쪽',          cls: 'door' },
  ];
  const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const sheet = document.getElementById('sheet');
  ROOMS.forEach(r => SPOTS.forEach(sp => {
    const data = 'MALLANG-AU:room:' + r.id + (sp.s ? ':' + sp.s : '');
    const cell = document.createElement('div');
    cell.className = 'cell ' + sp.cls;
    cell.innerHTML = `<span class="cut noprint">✂</span>
      <div class="tag">🏠 펜션 살리기</div>
      <h2 contenteditable="true" spellcheck="false">${esc(r.name)}</h2>
      <div class="kind">${sp.kind}</div>
      <div class="qr"></div>
      <div class="where">붙일 곳: <span contenteditable="true" spellcheck="false">${esc(sp.where)}</span></div>
      <div class="code">${esc(data)}</div>`;
    sheet.appendChild(cell);
    if (typeof QRCode === 'function') new QRCode(cell.querySelector('.qr'), { text: data, width: 512, height: 512, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  }));
  if (typeof QRCode !== 'function') document.getElementById('libErr').hidden = false;
  document.getElementById('links').innerHTML = '방별 미션 목록 바로가기<br>' + ROOMS.map(r => `<a href="${esc(new URL('mission.html?room=' + r.id, location.href).href)}">${esc(r.name)}</a>`).join(' · ');
})();
</script>
</body>
</html>

  { text: "제일 길치일 것 같은 사람", icon: "🗺️" },

  { text: "제일 노래 못할 것 같은 사람", icon: "🎤" },

];

// ========== 헬퍼 ==========
const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

// Fisher-Yates 셔플
const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// 인원수 기반 라운드 전체 시간 계산 (초)
// 평균 한 사람당 15~20초 미션 + 패스 시간 고려
// 최소 25초는 무조건 안전 (점화 직후 첫 사람 보호)
// 인원수별 안전 시간(s) + 최대 폭탄 시간(s).
// 안전 시간 = "이 시간 안에는 절대 안 터짐"
// 최대 시간 = "이 시간 안에는 무조건 터짐"
// 실제 폭발 시점: safe ~ max 사이 랜덤
// 미션 당 평균 ~8초 가정. 사용자 의도: 안전=한바퀴의 60~80%, 최대=한바퀴~두바퀴
const TIME_BY_PLAYERS = {
  3:  { safe: 24, max: 48 },
  4:  { safe: 32, max: 56 },
  5:  { safe: 40, max: 72 },
  6:  { safe: 32, max: 88 },
  7:  { safe: 40, max: 104 },
  8:  { safe: 40, max: 112 },
  9:  { safe: 48, max: 144 },
  10: { safe: 48, max: 160 },
};

// 폭발 전 경고 모션이 시작되는 시점 (폭발 N초 전, 라운드마다 랜덤)
const DANGER_WARNING_MIN = 10;
const DANGER_WARNING_MAX = 25;

// 휴대폰 한 번 들 때마다 사용 가능한 스킵 개수
const SKIPS_PER_HOLDER = 1;

// 안전 시간부터 최대 시간 사이 랜덤 폭발 시점 반환
const getRoundDuration = (playerCount) => {
  const cfg = TIME_BY_PLAYERS[playerCount] || TIME_BY_PLAYERS[10];
  return randomInt(cfg.safe, cfg.max);
};

// ========== 컴포넌트 ==========
function App() {
  const [phase, setPhase] = useState('setup'); // setup, ready, mission, photo, explode, gameover
  const [playerCount, setPlayerCount] = useState(5);
  const [customTime, setCustomTime] = useState(60); // 기본 커스텀 60초. null이면 인원별 자동
  const [mission, setMission] = useState(null);
  // 폭탄 타이머: 게임 시작 시점에 한 번만 정해지고, 패스해도 리셋 안 됨
  const [bombFuseTotal, setBombFuseTotal] = useState(0); // 이번 게임 폭탄 전체 시간(초)
  const [bombIgnitedAt, setBombIgnitedAt] = useState(null); // 점화 시각 (Date.now())
  const [bombRemainingTick, setBombRemainingTick] = useState(0); // 매 100ms 갱신, 위험 단계 판정용
  const [dangerThreshold, setDangerThreshold] = useState(15); // 폭발 N초 전부터 경고 (게임마다 랜덤)
  const [photo, setPhoto] = useState(null);
  const [photoGallery, setPhotoGallery] = useState([]);
  const [skipsLeft, setSkipsLeft] = useState(0); // 휴대폰 든 사람 스킵 권 (받을 때마다 1로 충전)
  const [prevMission, setPrevMission] = useState(null); // 스킵 직전 미션 (되돌리기용)
  const [missionQueue, setMissionQueue] = useState([]); // 셔플된 미션 큐. 한 판 동안 안 본 거 우선
  const [facingMode, setFacingMode] = useState('environment'); // 'environment'(후면) | 'user'(셀카)

  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const tickRef = useRef(null);
  const explodeFiredRef = useRef(false); // 폭발 중복 발화 방지

  // 폭탄 위험 단계 (마지막 dangerThreshold 초 이하)
  const isDanger = bombRemainingTick > 0 && bombRemainingTick <= dangerThreshold;

  // 미션 큐에서 다음 미션 뽑기. 큐가 비면 재셔플.
  // 함수형 업데이트로 stale closure 방지 (연속 호출에도 안전).
  const drawNextMission = useCallback(() => {
    setMissionQueue((q) => {
      let queue = q;
      if (queue.length === 0) queue = shuffle(MISSIONS);
      const head = queue[0];
      const rest = queue.slice(1);
      setMission(head);
      return rest;
    });
  }, []);

  // ========== 카메라 ==========
  // 인자로 mode를 받을 수 있게 함 (flipCamera에서 직접 호출 시 state 비동기 회피)
  const startCamera = useCallback(async (modeOverride) => {
    const mode = modeOverride || facingMode;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: mode },
        audio: false,
      });
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
      }
    } catch (err) {
      // 지정 모드 실패 시 아무 카메라
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false,
        });
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
        }
      } catch (err2) {
        console.error('Camera failed', err2);
        alert('카메라 권한이 필요합니다. 브라우저 설정에서 허용해주세요.');
      }
    }
  }, [facingMode]);

  const stopCamera = useCallback(() => {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach((t) => t.stop());
      streamRef.current = null;
    }
  }, []);

  // 전후면 카메라 전환
  const flipCamera = useCallback(() => {
    const newMode = facingMode === 'environment' ? 'user' : 'environment';
    setFacingMode(newMode);
    stopCamera();
    setTimeout(() => startCamera(newMode), 100);
  }, [facingMode, stopCamera, startCamera]);

  const takePhoto = useCallback(() => {
    if (!videoRef.current || !canvasRef.current) return;
    const video = videoRef.current;
    const canvas = canvasRef.current;
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    // 4:3 비율로 크롭 (화면에 보이는 영역과 동일)
    const TARGET_RATIO = 4 / 3;
    const videoRatio = vw / vh;
    let sx, sy, sWidth, sHeight;
    if (videoRatio > TARGET_RATIO) {
      // 비디오가 더 와이드 → 좌우 잘라냄
      sHeight = vh;
      sWidth = Math.round(vh * TARGET_RATIO);
      sx = Math.round((vw - sWidth) / 2);
      sy = 0;
    } else {
      // 비디오가 더 좁음 → 상하 잘라냄
      sWidth = vw;
      sHeight = Math.round(vw / TARGET_RATIO);
      sx = 0;
      sy = Math.round((vh - sHeight) / 2);
    }

    canvas.width = sWidth;
    canvas.height = sHeight;
    const ctx = canvas.getContext('2d');
    // 셀카 모드면 화면처럼 미러로 저장
    if (facingMode === 'user') {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, sWidth, sHeight);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    setPhoto(dataUrl);
    stopCamera();

    // 갤러리에 추가
    setPhotoGallery((g) => [
      ...g,
      {
        photo: dataUrl,
        mission: mission?.text || '',
      },
    ]);
  }, [stopCamera, mission, facingMode]);

  // ========== 폭탄 타이머 (한 판 동안 단 하나) ==========
  // bombIgnitedAt이 세팅된 동안 계속 돌면서 남은 시간 계산.
  // 패스/사진찍기 등으로 phase 바뀌어도 폭탄은 안 멈춤.
  useEffect(() => {
    // 폭탄 활성화 조건: 점화 시각이 있고, 폭탄이 굴러가는 단계
    const bombRunning =
      bombIgnitedAt !== null &&
      (phase === 'mission' || phase === 'photo');

    if (!bombRunning) {
      if (tickRef.current) {
        clearInterval(tickRef.current);
        tickRef.current = null;
      }
      return;
    }

    tickRef.current = setInterval(() => {
      const elapsed = (Date.now() - bombIgnitedAt) / 1000;
      const remaining = Math.max(0, bombFuseTotal - elapsed);
      setBombRemainingTick(remaining);

      // 진동: 위험 단계 동안 매초 부르르
      if (remaining > 0 && remaining <= dangerThreshold) {
        const justSec = Math.ceil(remaining);
        const prevSec = Math.ceil(remaining + 0.1);
        if (justSec !== prevSec && navigator.vibrate) {
          navigator.vibrate(150);
        }
      }

      if (remaining <= 0 && !explodeFiredRef.current) {
        explodeFiredRef.current = true;
        clearInterval(tickRef.current);
        tickRef.current = null;
        // 폭발!
        if (navigator.vibrate) navigator.vibrate([300, 100, 500]);
        handleExplode();
      }
    }, 100);

    return () => {
      if (tickRef.current) clearInterval(tickRef.current);
    };
    // eslint-disable-next-line
  }, [phase, bombIgnitedAt, bombFuseTotal, dangerThreshold]);

  const handleExplode = useCallback(() => {
    stopCamera();
    setPhase('explode');
  }, [stopCamera]);

  // ========== 게임 로직 ==========
  const startGame = () => {
    setPhotoGallery([]);
    setMissionQueue(shuffle(MISSIONS)); // 한 판 시작 시 미션 셔플
    setPhase('ready');
  };

  const startBomb = () => {
    // 폭탄 점화: customTime이 있으면 그 시간 고정, 없으면 인원별 자동 랜덤
    const dur = customTime != null ? customTime : getRoundDuration(playerCount);
    // 경고 시작 시점: 폭발 10~25초 전 랜덤. 단 폭탄 시간 자체보다는 짧게.
    const warningWindow = Math.min(
      randomInt(DANGER_WARNING_MIN, DANGER_WARNING_MAX),
      Math.max(5, Math.floor(dur / 2)) // 폭탄 시간의 절반 이하로 제한 (최소 5초)
    );
    drawNextMission();
    setBombFuseTotal(dur);
    setBombIgnitedAt(Date.now());
    setBombRemainingTick(dur);
    setDangerThreshold(warningWindow);
    setSkipsLeft(SKIPS_PER_HOLDER); // 휴대폰을 든 사람의 스킵 권
    explodeFiredRef.current = false;
    setPhoto(null);
    setPhase('mission');
    setTimeout(() => startCamera(), 100);
  };

  const handlePhotoTaken = () => {
    setPhase('photo');
  };

  const handleRetake = () => {
    setPhoto(null);
    // 갤러리에서 마지막 거 제거
    setPhotoGallery((g) => g.slice(0, -1));
    setPhase('mission');
    setTimeout(() => startCamera(), 100);
  };

  const handleSkipMission = () => {
    // 미션 스킵: 사진 안 찍고 다른 미션 받음. 폭탄은 그대로 굴러감.
    // 휴대폰 들고 있는 동안 1번만 가능. 패스하면 다음 사람이 다시 충전.
    if (skipsLeft <= 0) return;
    if (!mission) return;
    setSkipsLeft((s) => s - 1);
    // 직전 미션 저장 (되돌리기용). 큐에 다시 넣지 않고 여기 보관.
    setPrevMission(mission);

    // 새 미션 뽑기
    setMissionQueue((q) => {
      let queue = q;
      if (queue.length === 0) queue = shuffle(MISSIONS);
      const head = queue[0];
      const rest = queue.slice(1);
      setMission(head);
      return rest;
    });
  };

  const handleRevertSkip = () => {
    // 스킵 되돌리기: 원래 미션으로 복귀. 스킵권은 복구 안 됨 (이미 소진).
    // 새로 받았던 미션은 큐 중간에 다시 끼워넣음 (다른 사람이 받을 수 있게).
    if (!prevMission) return;
    const skippedNew = mission;
    setMission(prevMission);
    setPrevMission(null);
    setMissionQueue((q) => {
      let queue = q;
      if (queue.length === 0) queue = shuffle(MISSIONS);
      const insertAt = Math.min(queue.length, randomInt(3, 10));
      return [...queue.slice(0, insertAt), skippedNew, ...queue.slice(insertAt)];
    });
  };

  const handlePass = () => {
    // 통과 누르면 바로 다음 미션. 옆 사람한테 휴대폰 넘기는 건 사용자가 알아서.
    // 폭탄은 리셋 안 됨, 계속 굴러간다.
    // 새로 받는 사람은 스킵 다시 충전. 되돌리기 상태도 초기화.
    setSkipsLeft(SKIPS_PER_HOLDER);
    setPrevMission(null);
    drawNextMission();
    setPhoto(null);
    setPhase('mission');
    setTimeout(() => startCamera(), 100);
  };

  const handleAfterExplode = () => {
    // 폭탄 터졌으면 바로 게임오버 (파이널 리포트로)
    stopBombAndCleanup();
    setPhase('gameover');
  };

  // 강제 게임 종료: 게임 중 언제든 호출 가능. 바로 파이널 리포트로.
  const handleForceEnd = () => {
    stopBombAndCleanup();
    stopCamera();
    setPhase('gameover');
  };

  // 폭탄 상태와 타이머만 정리 (사진/카메라는 별도)
  const stopBombAndCleanup = () => {
    setBombIgnitedAt(null);
    setBombFuseTotal(0);
    setBombRemainingTick(0);
    explodeFiredRef.current = false;
  };

  const resetGame = () => {
    stopCamera();
    stopBombAndCleanup();
    setPhase('setup');
    setPhotoGallery([]);
    setSkipsLeft(0);
    setPrevMission(null);
    setMissionQueue([]);
    setFacingMode('environment');
  };

  // ========== 정리 ==========
  useEffect(() => {
    return () => {
      stopCamera();
      if (tickRef.current) clearInterval(tickRef.current);
    };
  }, [stopCamera]);

  // ========== 스타일 (시안 B: Stealth Mission HUD) ==========
  // 팔레트: 차콜 + 형광 그린 (#39d353) + 위험 레드 (#f85149)
  const styles = {
    root: {
      minHeight: '100vh',
      background: '#0d1117',
      color: '#e6edf3',
      fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif",
      padding: '16px',
      position: 'relative',
      overflow: 'hidden',
    },
    grain: {
      // 노이즈 제거 - 빈 div로 두지만 사용 안함 (호환성 위해 유지)
      display: 'none',
    },
    container: {
      maxWidth: '440px',
      margin: '0 auto',
      position: 'relative',
      zIndex: 1,
    },
    header: {
      textAlign: 'center',
      padding: '24px 0 16px',
      marginBottom: '12px',
    },
    logo: {
      fontSize: '24px',
      fontWeight: 700,
      letterSpacing: '0.15em',
      color: '#e6edf3',
      display: 'inline-block',
      textTransform: 'uppercase',
    },
    subtitle: {
      fontSize: '10px',
      color: '#39d353',
      marginTop: '6px',
      letterSpacing: '0.25em',
      fontFamily: "'JetBrains Mono', 'Menlo', monospace",
      fontWeight: 500,
    },
    card: {
      background: '#161b22',
      border: '0.5px solid #30363d',
      borderRadius: '6px',
      padding: '18px',
      marginBottom: '12px',
    },
    cardAccent: {
      // 미션 카드처럼 그린 액센트
      background: '#0d1117',
      border: '1px dashed #39d353',
      borderRadius: '6px',
      padding: '16px',
      marginBottom: '12px',
    },
    label: {
      fontSize: '10px',
      letterSpacing: '0.25em',
      color: '#39d353',
      fontWeight: 500,
      fontFamily: "'JetBrains Mono', 'Menlo', monospace",
      textTransform: 'uppercase',
    },
    labelMuted: {
      fontSize: '10px',
      letterSpacing: '0.2em',
      color: '#7d8590',
      fontWeight: 500,
      fontFamily: "'JetBrains Mono', 'Menlo', monospace",
    },
    input: {
      width: '100%',
      background: '#0d1117',
      border: '1px solid #30363d',
      borderRadius: '4px',
      padding: '12px 14px',
      color: '#e6edf3',
      fontFamily: 'inherit',
      fontSize: '14px',
      boxSizing: 'border-box',
    },
    btn: {
      width: '100%',
      background: '#39d353',
      color: '#0d1117',
      border: 'none',
      padding: '14px',
      fontSize: '13px',
      fontWeight: 700,
      letterSpacing: '0.15em',
      fontFamily: "'JetBrains Mono', 'Menlo', monospace",
      borderRadius: '4px',
      cursor: 'pointer',
      textTransform: 'uppercase',
      transition: 'all 0.1s',
    },
    btnDanger: {
      background: '#f85149',
      color: '#ffffff',
    },
    btnPass: {
      background: '#58a6ff',
      color: '#0d1117',
    },
    btnGhost: {
      background: 'transparent',
      color: '#7d8590',
      border: '1px solid #30363d',
    },
  };

  // ========== 화면 분기 ==========
  // 폭탄 진행 중인 phase일 때만 위험 효과 표시
  const bombActive = phase === 'mission' || phase === 'photo';
  const showDangerOverlay = bombActive && isDanger;

  // 카메라/사진 화면일 때는 페이지 패딩과 컨테이너 max-width 해제 (라이브뷰 풀폭)
  const rootStyle = bombActive
    ? { ...styles.root, padding: '0' }
    : styles.root;
  const containerStyle = bombActive
    ? { ...styles.container, maxWidth: '100%' }
    : styles.container;

  return (
    <div style={rootStyle}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Pretendard:wght@400;500;700;900&display=swap');
        @keyframes pulse-bomb {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.06); }
        }
        @keyframes shake {
          0%, 100% { transform: translate(0, 0); }
          10% { transform: translate(-2px, 1px); }

        }

      `}</style>

        {phase === 'photo' && (

        {phase === 'explode' && (

function PhotoCard({ g, index }) {
  const [shareStatus, setShareStatus] = useState('');

  const dataUrlToFile = async (dataUrl, filename) => {
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    return new File([blob], filename, { type: blob.type });
  };

  const handleShare = async () => {
    const filename = `shutter-bomb-${index + 1}.jpg`;
    try {
      const file = await dataUrlToFile(g.photo, filename);
      const shareData = {
        files: [file],
        title: 'Shutter Bomb',
        text: `미션: ${g.mission}`,
      };
      if (navigator.canShare && navigator.canShare(shareData)) {
        setShareStatus('sharing');
        await navigator.share(shareData);
        setShareStatus('');
        return;
      }
      if (navigator.share) {
        setShareStatus('sharing');
        await navigator.share({ title: 'Shutter Bomb', text: `미션: ${g.mission}` });
        setShareStatus('');
        return;
      }
      setShareStatus('unsupported');
      const a = document.createElement('a');
      a.href = g.photo;
      a.download = filename;
      a.click();
      setTimeout(() => setShareStatus(''), 2000);
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.error('Share failed', err);
        setShareStatus('error');
        setTimeout(() => setShareStatus(''), 2000);
      } else {
        setShareStatus('');
      }
    }
  };

  return (
    <div>
      <div style={{ position: 'relative' }}>
        <img
          src={g.photo}
          alt={g.mission}
          style={{
            width: '100%',
            aspectRatio: '4/3',
            objectFit: 'cover',
            borderRadius: '4px',
            border: '0.5px solid #30363d',
            display: 'block',
          }}
        />
      </div>
      <div
        style={{
          fontSize: '10px',
          color: '#7d8590',
          marginTop: '6px',
          minHeight: '14px',
          fontFamily: "'Pretendard', sans-serif",
          lineHeight: '1.3',
        }}
      >
        {g.mission}
      </div>
      <button
        onClick={handleShare}
        style={{
          width: '100%',
          marginTop: '6px',
          padding: '8px',
          background: 'transparent',
          color: '#39d353',
          border: '1px solid #30363d',
          borderRadius: '4px',
          fontSize: '10px',
          fontWeight: 700,
          letterSpacing: '0.15em',
          fontFamily: "'JetBrains Mono', monospace",
          cursor: 'pointer',
          textTransform: 'uppercase',
        }}
      >
        {shareStatus === 'sharing' && '공유 중...'}
        {shareStatus === 'unsupported' && '⬇ DOWNLOAD'}
        {shareStatus === 'error' && '⚠ FAILED'}
        {shareStatus === '' && '⬆ SHARE'}
      </button>
    </div>
  );
}

// ========== 전체 한꺼번에 공유 버튼 ==========
function ShareAllButton({ photoGallery }) {
  const [status, setStatus] = useState(''); // '', 'sharing', 'unsupported', 'error'

  const dataUrlToFile = async (dataUrl, filename) => {
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    return new File([blob], filename, { type: blob.type });
  };

  const handleShareAll = async () => {
    if (photoGallery.length === 0) return;
    try {
      // 모든 사진을 File 객체로 변환
      const files = await Promise.all(
        photoGallery.map((g, i) =>
          dataUrlToFile(g.photo, `shutter-bomb-${i + 1}.jpg`)
        )
      );
      const shareData = {
        files,
        title: 'Shutter Bomb',
        text: `📸 셔터밤 갤러리 ${photoGallery.length}장`,
      };
      // 다중 파일 공유 가능 여부 확인
      if (navigator.canShare && navigator.canShare(shareData)) {
        setStatus('sharing');
        await navigator.share(shareData);
        setStatus('');
        return;
      }
      // 폴백: 텍스트만 공유
      if (navigator.share) {
        setStatus('sharing');
        await navigator.share({
          title: 'Shutter Bomb',
          text: `📸 ${photoGallery.length}장의 폭소 사진!`,
        });
        setStatus('');
        return;
      }
      // 공유 자체 미지원
      setStatus('unsupported');
      setTimeout(() => setStatus(''), 2500);
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.error('Share all failed', err);
        setStatus('error');
        setTimeout(() => setStatus(''), 2500);
      } else {
        setStatus('');
      }
    }
  };

  return (
    <button
      onClick={handleShareAll}
      style={{
        width: '100%',
        marginBottom: '14px',
        padding: '14px',
        background: '#39d353',
        color: '#0d1117',
        border: 'none',
        borderRadius: '4px',
        fontSize: '12px',
        fontWeight: 700,
        letterSpacing: '0.1em',
        fontFamily: "'JetBrains Mono', monospace",
        cursor: 'pointer',
        textTransform: 'uppercase',
      }}
    >
      {status === 'sharing' && '공유 중...'}
      {status === 'unsupported' && '브라우저에서 미지원'}
      {status === 'error' && '⚠ 공유 실패'}
      {status === '' && `🚀 전체 ${photoGallery.length}장 한꺼번에 공유`}
    </button>
  );
}
